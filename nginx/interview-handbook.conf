# Nginx 生产配置：interview-handbook
# 使用方式：
#   sudo cp nginx/interview-handbook.conf /etc/nginx/sites-available/interview-handbook
#   sudo ln -s /etc/nginx/sites-available/interview-handbook /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl restart nginx

upstream backend_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vue SPA 静态资源（history 模式 fallback）
    location / {
        root /var/www/interview-handbook/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 与 SSE 流式接口
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        # SSE 关键：关闭缓冲与缓存，确保流式数据即时转发
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 保持长连接
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 显式透传 SSE 响应头
        proxy_set_header Cache-Control "no-cache";
    }

    # 静态资源长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/interview-handbook/frontend/dist;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}