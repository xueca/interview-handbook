# Nginx 生产配置：interview-handbook
# 使用方式：
#   sudo cp nginx/interview-handbook.conf /etc/nginx/sites-available/interview-handbook
#   sudo ln -s /etc/nginx/sites-available/interview-handbook /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl restart nginx

upstream backend_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;  # 无域名，匹配所有 IP 访问

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip 压缩（减小 JS/CSS/JSON 传输体积，首屏加载快 3 倍）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Vue SPA 静态资源（history 模式 fallback）
    location / {
        root /var/www/interview-handbook/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 与 SSE 流式接口
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        # SSE 关键：关闭响应缓冲与缓存，确保流式数据即时转发
        proxy_buffering off;
        proxy_cache off;
        # 注意：保留 request_buffering on（默认），确保 POST body 完整到达再转发
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 保持长连接
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 显式透传 SSE 响应头
        proxy_set_header Cache-Control "no-cache";
    }

    # 静态资源长期缓存
    # index.html 禁止缓存，确保每次请求都获取最新 build
    location = /index.html {
        root /var/www/interview-handbook/frontend/dist;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/interview-handbook/frontend/dist;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}