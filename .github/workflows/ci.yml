# 文件功能: 可复用 CI 工作流 | 触发方式: 被 deploy.yml 通过 workflow_call 调用
# 检查内容: 前端 ESLint + Vite 构建 + 后端文件行数检查
name: CI

on:
  workflow_call:
    secrets: inherit

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 Node.js 20 并启用 npm 缓存（加速 CI）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # 3. 安装前端依赖（npm ci 严格按 lock 文件安装，保证一致性）
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # 4. ESLint 代码检查（架构规则 + 文件行数 + 反模式）
      - name: Run ESLint
        run: npm run lint
        working-directory: frontend

      # 5. Vite 生产构建（验证代码可正常打包）
      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # 6. 后端文件行数检查（controllers<=150, routes<=50, middleware<=80）
      #    check-file-size.js 仅用 Node 内置模块（fs/path），无需 npm install
      - name: Check backend file sizes
        run: node scripts/check-file-size.js
        working-directory: backend
